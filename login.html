<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ - ระบบยืม-คืนอุปกรณ์กีฬา</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .register-wrap{ max-width:420px; margin:64px auto; padding:0 20px; }
  .register-panel{
    background:#fff; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.05);
    padding:28px 30px;
  }
  .register-title{ margin:0 0 6px; font-size:19px; font-weight:600; color:var(--text-dark); }
  .register-sub{ margin:0 0 22px; font-size:13px; color:#888; }
  .register-error{
    display:none; background:#fde3e3; color:#d4453a; border:1px solid #f5c2c2;
    border-radius:6px; padding:10px 14px; font-size:13px; margin-bottom:16px;
  }
  .register-error.show{ display:block; }
  .register-footer{
    margin-top:16px; text-align:center; font-size:13px; color:#777;
  }
  .register-footer a{ color:var(--teal); font-weight:500; text-decoration:none; }
  .register-footer a:hover{ text-decoration:underline; }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img src="LOGO-SSP.png" alt="logo" class="logo-img">
      <div class="brand-text">
        <p class="th">การยืม-คืนอุปกรณ์กีฬาของกลุ่มสาระการเรียนรู้สุขศึกษาและพลศึกษา</p>
        <p class="en">Sports Equipment Borrowing and Return Management System</p>
      </div>
    </div>
  </header>

  <main class="register-wrap">
    <section class="register-panel">
      <h2 class="register-title">เข้าสู่ระบบ</h2>
      <p class="register-sub">กรอกรหัสนักเรียนและรหัสผ่านของคุณ</p>

      <div id="loginError" class="register-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="login-studentid">รหัสนักเรียน</label>
          <input type="text" id="login-studentid" required>
        </div>

        <div class="form-group">
          <label for="login-password">รหัสผ่าน</label>
          <input type="password" id="login-password" required>
        </div>

        <button type="submit" class="btn-save" style="width:100%; margin-top:6px;">เข้าสู่ระบบ</button>
      </form>

      <p class="register-footer">ยังไม่เคยสมัครสมาชิก? <a href="register.html">สมัครสมาชิกที่นี่</a></p>
    </section>
  </main>

  <script src="sheetdb-api.js"></script>
  <script>
    // ถ้าเบราว์เซอร์นี้ล็อกอินอยู่แล้ว ให้ข้ามไปหน้าหลักเลย
    if (localStorage.getItem('currentMemberId')) {
      window.location.href = 'index.html';
    }

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'กำลังเข้าสู่ระบบ...';

      try {
        const studentId = document.getElementById('login-studentid').value.trim();
        const password = document.getElementById('login-password').value;

        const member = await loginMember(studentId, password);

        if (!member) {
          errorBox.textContent = 'รหัสนักเรียนหรือรหัสผ่านไม่ถูกต้อง';
          errorBox.classList.add('show');
          submitBtn.disabled = false;
          submitBtn.textContent = 'เข้าสู่ระบบ';
          return;
        }

        localStorage.setItem('currentMemberId', member.รหัสสมาชิก);
        window.location.href = 'index.html';
      } catch (err) {
        errorBox.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
        errorBox.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'เข้าสู่ระบบ';
      }
    });
  </script>
</body>
</html>
